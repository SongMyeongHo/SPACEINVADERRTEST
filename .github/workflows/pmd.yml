name: PMD Method Complexity

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pmd-methods-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pmd-code-scan:
    runs-on: ubuntu-latest

    env:
      PMD_VERSION: "6.55.0"
      SOURCE_PATH: "Invaders-SDP-23621-main/src"
      COMPLEXITY_LIMIT: "10"
      BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Download PMD
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 \
            "https://github.com/pmd/pmd/releases/download/pmd_releases%2F${PMD_VERSION}/pmd-bin-${PMD_VERSION}.zip" \
            --output "${RUNNER_TEMP}/pmd.zip"

          unzip -q "${RUNNER_TEMP}/pmd.zip" \
            -d "${RUNNER_TEMP}/pmd-tool"

      - name: Run PMD
        shell: bash
        run: |
          set -euo pipefail

          test -d "${SOURCE_PATH}"
          test -f ".github/workflows/pmd-ruleset.xml"

          "${RUNNER_TEMP}/pmd-tool/pmd-bin-${PMD_VERSION}/bin/run.sh" pmd \
            -d "${SOURCE_PATH}" \
            -R ".github/workflows/pmd-ruleset.xml" \
            -f xml \
            -r "${RUNNER_TEMP}/pmd-report.xml" \
            -language java \
            -version 17 \
            -no-cache \
            -failOnViolation false

      - name: Select methods changed in this PR
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          workspace = Path.cwd().resolve()
          temp = Path(os.environ["RUNNER_TEMP"])
          limit = int(os.environ["COMPLEXITY_LIMIT"])

          def git(*args):
              return subprocess.check_output(
                  ["git", *args],
                  encoding="utf-8",
              )

          base = git(
              "merge-base",
              os.environ["BASE_SHA"],
              "HEAD",
          ).strip()

          files = git(
              "diff",
              "--name-only",
              "-z",
              "--diff-filter=AMR",
              base,
              "HEAD",
              "--",
              "*.java",
          ).split("\0")

          changed = {}

          for filename in filter(None, files):
              diff = git(
                  "diff",
                  "--no-ext-diff",
                  "--no-color",
                  "--unified=0",
                  base,
                  "HEAD",
                  "--",
                  filename,
              )

              ranges = []
              for match in re.finditer(
                  r"^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@",
                  diff,
                  re.MULTILINE,
              ):
                  start = int(match.group(1))
                  count = (
                      int(match.group(2))
                      if match.group(2) is not None
                      else 1
                  )

                  if count:
                      ranges.append((start, start + count - 1))
                  else:
                      # Deletion-only change: retain its new-file anchor.
                      anchor = max(1, start)
                      ranges.append((anchor, anchor))

              changed[filename] = ranges

          root = ET.parse(temp / "pmd-report.xml").getroot()

          def local_name(element):
              return element.tag.rsplit("}", 1)[-1]

          # Do not publish a misleading clean result if analysis failed.
          errors = [
              element
              for element in root.iter()
              if local_name(element) in {
                  "error", "configerror", "configurationError"
              }
          ]
          if errors:
              details = [
                  element.attrib.get("msg")
                  or element.attrib.get("message")
                  or "".join(element.itertext()).strip()
                  for element in errors
              ]
              raise RuntimeError(
                  "PMD analysis errors:\n" + "\n".join(details)
              )

          rows = []
          seen = set()

          for file_element in root:
              if local_name(file_element) != "file":
                  continue

              file_path = Path(file_element.attrib["name"])
              if not file_path.is_absolute():
                  file_path = workspace / file_path

              try:
                  filename = (
                      file_path.resolve()
                      .relative_to(workspace)
                      .as_posix()
                  )
              except ValueError:
                  continue

              ranges = changed.get(filename)
              if not ranges:
                  continue

              for violation in file_element:
                  if local_name(violation) != "violation":
                      continue
                  if violation.attrib.get("rule") != "CyclomaticComplexity":
                      continue

                  message = "".join(violation.itertext()).strip()
                  match = re.search(
                      r"The method '(.+)' has a cyclomatic complexity of (\d+)",
                      message,
                  )
                  if not match:
                      continue

                  start = int(violation.attrib["beginline"])
                  end = int(violation.attrib["endline"])

                  if not any(
                      change_start <= end and change_end >= start
                      for change_start, change_end in ranges
                  ):
                      continue

                  name = match.group(1)
                  complexity = int(match.group(2))
                  key = (filename, start, name)

                  if key in seen:
                      continue
                  seen.add(key)

                  rows.append({
                      "file": filename,
                      "line": start,
                      "name": name,
                      "complexity": complexity,
                      "exceeded": complexity > limit,
                  })

          rows.sort(key=lambda row: (row["file"], row["line"]))

          (temp / "pmd-methods.json").write_text(
              json.dumps(rows, ensure_ascii=False),
              encoding="utf-8",
          )

          print(f"Changed methods found: {len(rows)}")
          PY

      - name: Create or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const rows = JSON.parse(
              fs.readFileSync(
                path.join(process.env.RUNNER_TEMP, 'pmd-methods.json'),
                'utf8'
              )
            );

            const marker = '<!-- pmd-complexity-report -->';

            function escapeCell(value) {
              return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\|/g, '&#124;')
                .replace(/[\r\n]+/g, ' ');
            }

            let body = [
              marker,
              '| 메서드 이름 | 복잡도 | 초과 여부 |',
              '|---|---:|---|'
            ].join('\n');

            if (rows.length === 0) {
              body += '\n| 변경된 분석 대상 메서드 없음 | — | — |';
            }

            for (const row of rows) {
              const line =
                `\n| ${escapeCell(row.name)} | ${row.complexity} | ` +
                `${row.exceeded ? '⚠️ 초과' : '정상'} |`;

              if (body.length + line.length > 55000) {
                body += '\n\n댓글 길이 제한으로 일부 항목이 생략됐습니다.';
                break;
              }

              body += line;
            }

            const params = {
              ...context.repo,
              issue_number: context.issue.number
            };

            const comments = await github.paginate(
              github.rest.issues.listComments,
              params
            );

            const previous = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...params,
                body
              });
            }

      - name: Save PMD reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-method-complexity
          path: |
            ${{ runner.temp }}/pmd-report.xml
            ${{ runner.temp }}/pmd-methods.json
          if-no-files-found: ignore
