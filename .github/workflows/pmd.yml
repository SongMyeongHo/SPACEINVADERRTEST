# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: pmd

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 3 * * 5'

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  pmd-code-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run PMD
        id: pmd
        uses: pmd/pmd-github-action@v2
        with:
          version: '6.55.0'
          rulesets: '.github/workflows/pmd-ruleset.xml'
          sourcePath: 'Invaders-SDP-23621-main/src'
          analyzeModifiedFilesOnly: false
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pmd-report.sarif
      - name: Comment method complexity on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(
              fs.readFileSync('pmd-report.sarif', 'utf8')
            );
            const marker = '<!-- pmd-complexity-report -->';
            const lines = [];

            for (const run of report.runs ?? []) {
              const rules = run.tool?.driver?.rules ?? [];

              for (const result of run.results ?? []) {
                const ruleId = result.ruleId ??
                  rules[result.ruleIndex]?.id ?? '';

                if (!ruleId.includes('CyclomaticComplexity')) continue;

                const location =
                  result.locations?.[0]?.physicalLocation;
                const file =
                  location?.artifactLocation?.uri ?? 'unknown';
                const line = location?.region?.startLine ?? '?';
                const message = (result.message?.text ?? '')
                  .replace(/\r?\n/g, ' ');

                lines.push(`- \`${file}:${line}\` — ${message}`);
              }
            }

            const header = `${marker}\n## 메서드별 순환 복잡도\n\n`;
            const footer =
              `\n\n[전체 PMD 보고서 확인](${context.serverUrl}/` +
              `${context.repo.owner}/${context.repo.repo}/actions/runs/` +
              `${context.runId})`;

            let details = lines.length
              ? ''
              : '설정한 기준에 해당하는 메서드가 없습니다.';

            for (const line of lines) {
              if (details.length + line.length > 50000) {
                details += '\n\n나머지 항목은 전체 보고서에서 확인하세요.';
                break;
              }
              details += `${line}\n`;
            }

            const body = header + details + footer;
            const params = {
              ...context.repo,
              issue_number: context.issue.number
            };

            const comments = await github.paginate(
              github.rest.issues.listComments,
              params
            );

            const previous = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...params,
                body
              });
            }
