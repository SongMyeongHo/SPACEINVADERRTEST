# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: pmd

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 3 * * 5'

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  pmd-code-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run PMD
        id: pmd
        uses: pmd/pmd-github-action@v2
        with:
          version: '6.55.0'
          rulesets: '.github/workflows/pmd-ruleset.xml'
          sourcePath: 'Invaders-SDP-23621-main/src'
          analyzeModifiedFilesOnly: false
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pmd-report.sarif
      - name: Comment changed method complexity
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execFileSync } = require('child_process');
            const { fileURLToPath } = require('url');

            const limit = 10;
            const marker = '<!-- pmd-complexity-report -->';
            const git = (...args) =>
              execFileSync('git', args, { encoding: 'utf8' });

            const base = git(
              'merge-base', process.env.BASE_SHA, 'HEAD'
            ).trim();

            const files = git(
              'diff', '--name-only', '-z', '--diff-filter=AMR',
              base, 'HEAD', '--', '*.java'
            ).split('\0').filter(Boolean);

            // PR에서 변경된 줄 범위를 파일별로 수집합니다.
            const changed = new Map();
            for (const file of files) {
              const diff = git(
                'diff', '--no-ext-diff', '--no-color',
                '--unified=0', base, 'HEAD', '--', file
              );
              const ranges = [];

              for (const match of diff.matchAll(
                /^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@/gm
              )) {
                const start = Number(match[1]);
                const count = match[2] === undefined
                  ? 1 : Number(match[2]);

                // 삭제만 있는 변경도 해당 위치를 검사합니다.
                ranges.push([
                  Math.max(1, start),
                  count === 0
                    ? Math.max(1, start)
                    : start + count - 1
                ]);
              }

              changed.set(file, ranges);
            }

            function relativeFile(uri) {
              let file = uri.startsWith('file:')
                ? fileURLToPath(uri)
                : decodeURIComponent(uri);

              if (path.isAbsolute(file)) {
                file = path.relative(process.cwd(), file);
              }
              return file.replace(/\\/g, '/').replace(/^\.\//, '');
            }

            const report = JSON.parse(
              fs.readFileSync('pmd-report.sarif', 'utf8')
            );
            const rows = [];
            const seen = new Set();

            for (const run of report.runs ?? []) {
              for (const result of run.results ?? []) {
                const message = result.message?.text ?? '';
                const match = message.match(
                  /The method '(.+)' has a cyclomatic complexity of (\d+)/
                );
                if (!match) continue;

                const location =
                  result.locations?.[0]?.physicalLocation;
                const artifact = location?.artifactLocation;
                const uri = artifact?.uri ??
                  run.artifacts?.[artifact?.index]?.location?.uri;
                if (!uri) continue;

                const file = relativeFile(uri);
                const ranges = changed.get(file);
                if (!ranges) continue;

                const region = location.region;
                if (!region?.startLine || !region?.endLine) {
                  throw new Error(
                    `메서드 범위 정보가 없습니다: ${file}. ` +
                    '정확한 변경 메서드 필터링을 위해 보고서 확인이 필요합니다.'
                  );
                }

                const touched = ranges.some(([start, end]) =>
                  start <= region.endLine &&
                  end >= region.startLine
                );
                if (!touched) continue;

                const key = `${file}:${region.startLine}:${match[1]}`;
                if (seen.has(key)) continue;
                seen.add(key);

                const name = match[1].replace(/\|/g, '&#124;');
                const complexity = Number(match[2]);
                rows.push(
                  `| ${name} | ${complexity} | ` +
                  `${complexity > limit ? '⚠️ 초과' : '정상'} |`
                );
              }
            }

            const header = [
              marker,
              `허용 복잡도: ${limit} 이하`,
              '',
              '| 메서드 이름 | 복잡도 | 기준 초과 |',
              '|---|---:|---|'
            ].join('\n');

            let body = rows.length
              ? header
              : `${marker}\n이번 PR에서 변경된 분석 대상 메서드가 없습니다.`;

            for (const row of rows) {
              if (body.length + row.length > 55000) {
                body += '\n\n댓글 길이 제한으로 나머지 항목은 생략했습니다.';
                break;
              }
              body += '\n' + row;
            }

            const params = {
              ...context.repo,
              issue_number: context.issue.number
            };
            const comments = await github.paginate(
              github.rest.issues.listComments, params
            );
            const previous = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...params,
                body
              });
            }
