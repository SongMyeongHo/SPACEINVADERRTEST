# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: pmd

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 3 * * 5'

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  pmd-code-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run PMD
        id: pmd
        uses: pmd/pmd-github-action@v2
        with:
          version: '6.55.0'
          rulesets: '.github/workflows/pmd-ruleset.xml'
          sourcePath: 'Invaders-SDP-23621-main/src'
          analyzeModifiedFilesOnly: false
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pmd-report.sarif
      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.pmd.outputs.violations != '0'
        uses: actions/github-script@v7
        env:
          PMD_VIOLATIONS: ${{ steps.pmd.outputs.violations }}
        with:
          script: |
            const marker = '<!-- pmd-complexity-report -->';
            const body = `${marker}
            ⚠️ **PMD 복잡도 검사 완료**
            
            복잡도 기준을 넘은 항목이 ${process.env.PMD_VIOLATIONS}개 발견됐습니다.
            메서드를 나누거나 분기 조건을 단순화해 주세요.
            
            [분석 결과 확인](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            };

            const comments = await github.paginate(
              github.rest.issues.listComments,
              params
            );
            const previous = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: params.owner,
                repo: params.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...params,
                body
              });
            }
